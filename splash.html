<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Energy4All — SDG 7 Affordable and Clean Energy</title>
  <meta name="description" content="Energy4All website shows how individuals, communities and organisations can take real action on clean, affordable energy.">

  <!-- Global stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Internal CSS -->
  <style>
    /* Prevent scrolling while loading overlay is active */
    body.loading {
      overflow: hidden;
    }

    /* ==========================================
       SPLASH SCREEN STYLES
       ========================================== */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0a2346;
      background-image: radial-gradient(circle at center, rgba(16, 50, 95, 0.95), #0a2346);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      color: #ffffff;
      padding: 20px;
      animation: splashPopIn 0.8s ease-out;
    }

    .splash-logo-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      z-index: 2;
      position: relative;
    }

    /* Animated energy ring around the logo */
    .pulse-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent-green, #10b981);
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-content h2 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .splash-content h2 .highlight {
      color: var(--accent-green, #10b981);
    }

    .splash-tagline {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 30px;
      opacity: 0.9;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Progress bar tuned to 4 Seconds */
    .loading-bar-wrap {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      border-radius: 10px;
      animation: loadProgress 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Keyframe Animations */
    @keyframes loadProgress {
      0% { width: 0%; }
      50% { width: 65%; }
      100% { width: 100%; }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
      }
      70% {
        transform: scale(1.15);
        opacity: 0;
        box-shadow: 0 0 0 15px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.85);
        opacity: 0;
      }
    }

    @keyframes splashPopIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ==========================================
       ORIGINAL PAGE STYLES
       ========================================== */
    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-content-inner {
      animation: heroFadeIn 0.8s ease-out;
    }

    .hero-wrap {
      background-image:
        linear-gradient(rgba(10, 35, 70, 0.30), rgba(10, 35, 70, 0.60)),
        url("images/home_background.jpg");
    }

    .card ul.highlights li {
      list-style: none;
      padding-left: 22px;
      position: relative;
      margin-bottom: 6px;
    }

    .card ul.highlights li::before {
      content: "✅";
      position: absolute;
      left: 0;
      color: var(--accent-green);
    }

    .card ul.highlights {
      padding-left: 0;
    }

    .topic-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      margin: 30px 0 60px;
    }

    .topic-tile {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      height: 220px;
      text-decoration: none;
      display: block;
      box-shadow: var(--shadow-soft);
    }

    .topic-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .topic-tile:hover img,
    .topic-tile:focus img {
      transform: scale(1.08);
    }

    .topic-tile .tile-label {
      position: absolute;
      inset: auto 0 0 0;
      background: linear-gradient(transparent, rgba(10, 35, 70, 0.9));
      color: var(--white);
      padding: 16px;
      font-weight: 700;
      transform: translateY(6px);
      transition: transform 0.3s ease;
    }

    .topic-tile:hover .tile-label,
    .topic-tile:focus .tile-label {
      transform: translateY(0);
    }

    main > .section-title:first-of-type {
      margin-top: 80px;
    }
  </style>
</head>
<body class="loading">

  <!-- ========================================== -->
  <!-- SPLASH SCREEN OVERLAY                      -->
  <!-- ========================================== -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-wrap">
        <img src="Energy4all_Logo.png" alt="Energy4All Logo" class="splash-logo">
        <div class="pulse-ring"></div>
      </div>
      <h2>Energy<span class="highlight">4All</span></h2>
      <p class="splash-tagline">Powering Tomorrow with Clean, Affordable Energy</p>
      
      <div class="loading-bar-wrap">
        <div class="loading-bar"></div>
      </div>
    </div>
  </div><!-- Splash Screen Logic (Updated for 4 Seconds) -->
  <script>
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash-screen');
      // Smoothly fade out the splash screen after 4000ms (4 seconds)
      setTimeout(() => {
        splash.classList.add('fade-out');
        document.body.classList.remove('loading');
      }, 4000);
    });
  </script>
</body>
</html>
